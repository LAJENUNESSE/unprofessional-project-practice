[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-cleaner"
version = "0.1.0"
description = "CSV 数据清洗与报表工具（Tkinter 桌面版）"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "matplotlib",
    "chardet",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",
]

[project.scripts]
csv-cleaner = "csv_cleaner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
